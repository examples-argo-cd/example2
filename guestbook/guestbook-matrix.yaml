apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: guestbook-matrix
  namespace: argocd
spec:
  generators:
  - matrix:
      generators:
      - list:
          elements:
          - cluster: dev
            url: https://kubernetes.default.svc
          - cluster: staging
            url: https://staging-cluster-api.example.com
          - cluster: production
            url: https://production-cluster-api.example.com
      - list:
          elements:
          - environment: dev
            replicas: "1"
            resources:
              limits:
                cpu: 100m
                memory: 128Mi
              requests:
                cpu: 50m
                memory: 64Mi
          - environment: staging
            replicas: "2"
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
          - environment: production
            replicas: "3"
            resources:
              limits:
                cpu: 300m
                memory: 512Mi
              requests:
                cpu: 150m
                memory: 256Mi
  template:
    metadata:
      name: guestbook-{{cluster}}-{{environment}}
    spec:
      project: default
      source:
        repoURL: https://github.com/examples-argo-cd/example2.git
        targetRevision: HEAD
        path: guestbook
        helm:
          parameters:
          - name: replicaCount
            value: "{{replicas}}"
          - name: resources.limits.cpu
            value: "{{resources.limits.cpu}}"
          - name: resources.limits.memory
            value: "{{resources.limits.memory}}"
          - name: resources.requests.cpu
            value: "{{resources.requests.cpu}}"
          - name: resources.requests.memory
            value: "{{resources.requests.memory}}"
      destination:
        server: "{{url}}"
        namespace: guestbook-{{environment}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true